name: Check styling

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    php-cs-fixer:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  tools: php-cs-fixer:3
                  coverage: none

            - name: Check PHP styling
              run: php-cs-fixer fix --config=.php_cs.dist.php --allow-risky=yes --dry-run --diff
